
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>آموزشکده | به‌زودی بازمی‌گردیم</title>
  <meta name="description" content="سایت آموزشکده در حال به‌روزرسانی است. به‌زودی بازمی‌گردیم.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f7fafc;
      font-family: Vazirmatn, Tahoma, sans-serif;
      background: radial-gradient(circle at top, #24516d, #102a43 65%);
    }
    main {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 48px 28px;
      border: 1px solid #ffffff24;
      border-radius: 24px;
      background: #ffffff0c;
      box-shadow: 0 24px 80px #0002;
    }
    .icon { font-size: 48px; }
    h1 { font-size: clamp(30px, 6vw, 46px); margin: 12px 0; }
    h2 { color: #f0c674; font-size: clamp(21px, 4vw, 28px); }
    p { line-height: 2.2; color: #e2e8f0; }
    .line { width: 64px; height: 4px; background: #f0c674;
      border-radius: 8px; margin: 24px auto; }
    footer { margin-top: 32px; font-size: 13px; color: #bdcbd8; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📚</div>
    <h1>آموزشکده</h1>
    <div class="line"></div>
    <h2>در حال به‌روزرسانی هستیم</h2>
    <p>
      در حال آماده‌سازی دوباره‌ی مطالب آموزشی و محتوای سایت هستیم.
      به‌زودی با مطالب تازه بازمی‌گردیم.
    </p>
    <footer>از همراهی شما سپاسگزاریم</footer>
  </main>
</body>
</html>
